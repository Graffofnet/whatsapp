<body>
<div class="phone">

  <div class="boot-loader" id="bootLoader">
    <div class="boot-spinner"></div>
    <span>Подключение к серверу…</span>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="icon-btn hamburger" id="menuBtn" aria-label="Меню">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    </button>
    <div class="top-title" id="topTitle">
      Общий чат
      <small id="topSub">комната · general</small>
    </div>
    <button class="icon-btn home-btn" id="homeBtn" aria-label="Вернуться в общий чат" title="Вернуться в общий чат">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <button class="icon-btn lock-btn" id="lockBtn" aria-label="Запомни мой ID" title="Запомни мой ID">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
    </button>
    <button class="topbar-close" id="topbarClose" aria-label="Очистить чат" title="Очистить чат">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div class="messages" id="messages">
    <div class="date-divider">Сегодня</div>
  </div>

  <div class="recorder-panel">
    <button class="record-btn-big" id="recordBtn">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      <span>Нажми и запиши</span>
    </button>
  </div>

  <div class="hint" id="hint">Удерживай кнопку для записи</div>

  <!-- DRAWER -->
  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div>
        <div class="drawer-title">Меню</div>
        <div class="drawer-sub">Действия и настройки чата</div>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Закрыть">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="user-card" id="userCard">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="user-label">
            Ваш ID
            <span class="pin-badge">📌 сохранён</span>
          </div>
          <div class="user-id" id="userIdDisplay">—</div>
        </div>
        <button class="user-copy" id="copyUserId" title="Скопировать ID">
          <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        </button>
      </div>

      <div class="room-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <span>Комната:</span>
        <span class="room-id" id="roomIdDisplay">general</span>
      </div>

      <button class="drawer-item green" id="newChatBtn">
        <span class="item-icon">
          <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-6 9h-3v3h-2v-3H6V9h3V6h2v3h3v2z"/></svg>
        </span>
        <span class="item-text">
          Создать личный чат
          <small>комната = ваш ID</small>
        </span>
      </button>

      <button class="drawer-item violet" id="inviteBtn">
        <span class="item-icon">
          <svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
        </span>
        <span class="item-text">
          Пригласить в комнату
          <small>скопировать ссылку-приглашение</small>
        </span>
      </button>

      <div class="folder" id="bgFolder">
        <button class="folder-header" id="folderToggle" aria-expanded="false">
          <span class="folder-icon">
            <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </span>
          <span class="folder-label">Фоны чата <span class="folder-count">(7)</span></span>
          <svg class="folder-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
        <div class="folder-content">
          <div class="bg-grid" id="bgGrid"></div>
        </div>
      </div>
    </div>
