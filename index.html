<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Whatsapp - VoiceChat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    background: #0b141a;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    height: 100vh;
    max-height: 900px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: #0b141a;
  }

  /* ============ TOP BAR ============ */
  .topbar {
    background: #202c33;
    color: #aebac1;
    padding: 10px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 30;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    position: relative;
    min-height: 56px;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #aebac1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s, color .15s, transform .12s;
    flex-shrink: 0;
    padding: 0;
    position: relative;
  }
  .icon-btn:hover { background: rgba(255,255,255,.06); color: #e9edef; }
  .icon-btn:active { background: rgba(255,255,255,.1); transform: scale(.92); }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; display: block; transition: transform .2s ease; }

  /* Hamburger */
  .hamburger { }

  /* Home */
  .home-btn { }
  .home-btn.active {
    color: #00a884;
  }

  /* Lock — "запомни мой id" */
  .lock-btn.remembered {
    color: #00a884;
  }
  .lock-btn.remembered svg {
    animation: lockBounce .5s cubic-bezier(.34,1.56,.64,1);
  }
  .lock-btn.remembered::after {
    content: "";
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    background: #00a884;
    border-radius: 50%;
    border: 2px solid #202c33;
    box-shadow: 0 0 6px rgba(0,168,132,.9);
  }
  @keyframes lockBounce {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35) rotate(-8deg); }
    70%  { transform: scale(.92) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .top-title {
    color: #e9edef;
    font-size: 16px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    margin-left: 4px;
  }
  .top-title small {
    display: block;
    font-size: 12px;
    color: #8696a0;
    font-weight: 400;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Close — SVG 30×30 */
  .topbar-close {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #8696a0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background .15s, color .15s;
  }
  .topbar-close:hover { background: rgba(255,255,255,.06); color: #e9edef; }
  .topbar-close:active { background: rgba(255,255,255,.1); }
  .topbar-close svg { width: 30px; height: 30px; fill: currentColor; display: block; }

  /* ============ MESSAGES ============ */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
    transition: background-color .35s ease, background-image .35s ease;
    background-color: #0b141a;
    background-attachment: local;
    position: relative;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 3px; }

  .date-divider {
    align-self: center;
    background: rgba(24,34,41,.85);
    color: #8696a0;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 8px;
    margin: 8px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    backdrop-filter: blur(4px);
  }
  .join-notice {
    align-self: center;
    background: rgba(0,168,132,.16);
    color: #06cf9c;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 8px;
    margin: 8px 0;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(0,168,132,.3);
    animation: slideIn .3s ease;
  }
  .join-notice svg { width: 14px; height: 14px; fill: currentColor; }

  .msg {
    max-width: 82%;
    padding: 6px 9px;
    border-radius: 5px;
    position: relative;
    animation: slideIn .22s ease;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    transition: opacity .18s ease, transform .18s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg.in  { align-self: flex-start; background: #202c33; }
  .msg.out { align-self: flex-end;   background: #005c4b; }

  .msg.deleting { opacity: 0; transform: scale(.85); }
  .msg.deleted {
    background: #182229 !important;
    color: #8696a0;
    font-style: italic;
    cursor: default;
  }
  .deleted-content {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 2px 3px 0;
    min-width: 190px;
    font-size: 14px;
  }
  .deleted-content svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; opacity: .8; }
  .msg.deleted .time { color: #8696a0; }
  .msg.deleted .time .ticks { display: none; }

  .msg .time {
    font-size: 11px;
    color: #8696a0;
    margin-left: 8px;
    float: right;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    line-height: 1;
  }
  .msg.out .time { color: #a0c8bd; }
  .msg.out .time .ticks { color: #53bdeb; font-size: 13px; letter-spacing: -3px; margin-left: 2px; }

  /* ============ VOICE BUBBLE ============ */
  .voice-bubble {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 210px;
    padding: 4px 2px 4px 0;
  }
  .play-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #8696a0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: color .15s, transform .1s;
    padding: 0;
  }
  .msg.out .play-btn { color: #a0c8bd; }
  .play-btn:hover { color: #e9edef; }
  .play-btn:active { transform: scale(.9); }
  .play-btn svg { width: 26px; height: 26px; fill: currentColor; }

  .waveform {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2.5px;
    height: 28px;
    cursor: pointer;
    padding: 0 2px;
  }
  .wave-bar {
    flex: 1;
    min-width: 2px;
    max-width: 3px;
    background: #8696a0;
    border-radius: 2px;
    transition: background .12s;
    opacity: .75;
  }
  .msg.out .wave-bar { background: #a0c8bd; }
  .wave-bar.played { background: #e9edef; opacity: 1; }
  .msg.out .wave-bar.played { background: #d6f5ea; }

  .voice-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    min-width: 42px;
  }
  .voice-duration {
    font-size: 11px;
    color: #8696a0;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .msg.out .voice-duration { color: #a0c8bd; }
  .mic-icon-mini { width: 13px; height: 13px; color: #53bdeb; opacity: .9; }

  /* ============ RECORD BUTTON ============ */
  .recorder-panel {
    background: #202c33;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: center;
    border-top: 1px solid #2a3942;
    flex-shrink: 0;
    min-height: 76px;
    z-index: 20;
  }
  .record-btn-big {
    width: 100%;
    background: #00a884;
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 14px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: inherit;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background .18s, transform .1s, box-shadow .18s;
    box-shadow: 0 3px 10px rgba(0,168,132,.28);
    min-height: 52px;
    overflow: hidden;
    position: relative;
  }
  .record-btn-big:hover { background: #06cf9c; }
  .record-btn-big:active { transform: scale(.98); }
  .record-btn-big svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
  .record-btn-big.recording {
    background: #ff4d4d;
    box-shadow: 0 3px 14px rgba(255,77,77,.45);
  }
  .record-btn-big.recording:hover { background: #ff4d4d; }

  .record-btn-big.locked {
    background: #e53935;
    animation: lockedPulse 1.4s ease-in-out infinite;
  }
  @keyframes lockedPulse {
    0%, 100% { box-shadow: 0 3px 14px rgba(255,77,77,.45); }
    50%      { box-shadow: 0 3px 28px rgba(255,77,77,.9); }
  }
  .lock-indicator {
    width: 18px; height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #fff;
    animation: lockIn .4s cubic-bezier(.34,1.56,.64,1);
  }
  .lock-indicator svg { width: 16px; height: 16px; fill: currentColor; }
  @keyframes lockIn {
    from { transform: scale(0) rotate(-180deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);    opacity: 1; }
  }

  .rec-timer {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: center;
  }
  .rec-timer::before {
    content: "";
    display: inline-block;
    width: 9px; height: 9px;
    background: #fff;
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  .live-wave {
    display: flex;
    align-items: center;
    gap: 2.5px;
    height: 26px;
    flex: 1;
    max-width: 140px;
    justify-content: center;
  }
  .live-bar {
    flex: 1;
    max-width: 4px;
    background: rgba(255,255,255,.85);
    border-radius: 2px;
    transition: height .07s linear;
  }

  .hint {
    position: absolute;
    bottom: 96px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: rgba(0,0,0,.85);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    white-space: nowrap;
    z-index: 60;
    backdrop-filter: blur(6px);
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .typing {
    align-self: flex-start;
    background: #202c33;
    padding: 14px 18px;
    border-radius: 5px;
    display: flex;
    gap: 5px;
    animation: slideIn .22s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .typing span {
    width: 8px; height: 8px;
    background: #8696a0;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ============ МЕНЮ УДАЛЕНИЯ ============ */
  .msg-menu {
    position: fixed;
    background: #233138;
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 8px 28px rgba(0,0,0,.55);
    z-index: 1000;
    animation: menuIn .16s ease;
    min-width: 170px;
    border: 1px solid rgba(255,255,255,.05);
  }
  @keyframes menuIn {
    from { opacity: 0; transform: scale(.9) translateY(-4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .msg-menu-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    border: none;
    color: #e9edef;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 7px;
    width: 100%;
    text-align: left;
    transition: background .15s;
  }
  .msg-menu-btn:hover { background: #2a3942; }
  .msg-menu-btn:active { background: #374a55; }
  .msg-menu-btn svg { width: 18px; height: 18px; fill: #ff6b6b; flex-shrink: 0; }
  .msg-menu-btn.danger { color: #ff8a8a; }

  /* ============ DRAWER ============ */
  .drawer-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 40;
    backdrop-filter: blur(1px);
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 300px;
    max-width: 85%;
    background: #111b21;
    color: #e9edef;
    transform: translateX(-102%);
    transition: transform .28s cubic-bezier(.2,.8,.3,1);
    z-index: 50;
    display: flex;
    flex-direction: column;
    box-shadow: 4px 0 20px rgba(0,0,0,.5);
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 22px 20px 12px;
    border-bottom: 1px solid #222d34;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .drawer-title { font-size: 17px; font-weight: 600; color: #e9edef; }
  .drawer-sub { font-size: 12px; color: #8696a0; margin-top: 3px; }
  .drawer-close {
    background: transparent;
    border: none;
    color: #8696a0;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .drawer-close:hover { background: rgba(255,255,255,.06); color: #e9edef; }
  .drawer-close svg { width: 18px; height: 18px; fill: currentColor; }

  .drawer-body {
    padding: 12px 12px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .drawer-body::-webkit-scrollbar { width: 6px; }
  .drawer-body::-webkit-scrollbar-thumb { background: #2a3942; border-radius: 3px; }

  .user-card {
    background: linear-gradient(135deg, #1a2b33 0%, #182229 100%);
    border: 1px solid #24343d;
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .user-card::before {
    content: "";
    position: absolute;
    top: -30px; right: -30px;
    width: 90px; height: 90px;
    background: radial-gradient(circle, rgba(0,168,132,.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .user-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00a884, #005c4b);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: #fff;
    font-size: 17px;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0,168,132,.35);
    text-transform: uppercase;
  }
  .user-info { flex: 1; min-width: 0; }
  .user-label {
    font-size: 11px;
    color: #8696a0;
    text-transform: uppercase;
    letter-spacing: .5px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .user-label .pin-badge {
    font-size: 9px;
    background: rgba(0,168,132,.2);
    color: #06cf9c;
    padding: 2px 6px;
    border-radius: 6px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    display: none;
  }
  .user-card.remembered .pin-badge { display: inline-block; }
  .user-id {
    font-size: 14px;
    color: #e9edef;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -.3px;
  }
  .user-copy {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.06);
    color: #8696a0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s, transform .1s;
  }
  .user-copy:hover { background: rgba(0,168,132,.2); color: #00a884; }
  .user-copy:active { transform: scale(.92); }
  .user-copy svg { width: 16px; height: 16px; fill: currentColor; }
  .user-copy.copied { background: rgba(0,168,132,.3); color: #06cf9c; }

  .room-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(83,189,235,.1);
    border: 1px solid rgba(83,189,235,.22);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #8ed2f5;
  }
  .room-badge svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
  .room-badge .room-id {
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    color: #53bdeb;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .drawer-item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: transparent;
    border: none;
    color: #e9edef;
    padding: 14px 14px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 10px;
    width: 100%;
    text-align: left;
    transition: background .15s;
    margin-bottom: 6px;
  }
  .drawer-item:hover { background: #1f2c33; }
  .drawer-item:active { background: #2a3942; }
  .drawer-item .item-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .drawer-item .item-icon svg { width: 20px; height: 20px; fill: currentColor; }
  .drawer-item.green .item-icon   { background: rgba(0,168,132,.16); color: #00a884; }
  .drawer-item.blue .item-icon    { background: rgba(83,189,235,.14); color: #53bdeb; }
  .drawer-item.amber .item-icon   { background: rgba(255,193,7,.14);  color: #ffc107; }
  .drawer-item.violet .item-icon  { background: rgba(138,92,246,.16); color: #a78bfa; }

  .drawer-item .item-text { flex: 1; min-width: 0; }
  .drawer-item .item-text small {
    display: block;
    font-size: 12px;
    color: #8696a0;
    margin-top: 2px;
    font-weight: 400;
  }

  .folder {
    background: #182229;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 4px;
  }
  .folder-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 13px 14px;
    background: transparent;
    border: none;
    color: #e9edef;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s;
  }
  .folder-header:hover { background: #1f2c33; }
  .folder-header .folder-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(83,189,235,.14);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .folder-header .folder-icon svg { width: 20px; height: 20px; fill: #53bdeb; }
  .folder-header .folder-label { flex: 1; text-align: left; }
  .folder-header .folder-count {
    font-size: 12px;
    color: #8696a0;
    font-weight: 400;
    margin-left: 6px;
  }
  .folder-header .folder-arrow {
    width: 18px; height: 18px;
    fill: #8696a0;
    transition: transform .25s ease;
    flex-shrink: 0;
  }
  .folder.open .folder-header .folder-arrow { transform: rotate(180deg); }

  .folder-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease;
  }
  .folder.open .folder-content { max-height: 1200px; }

  .bg-grid {
    padding: 8px 12px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .bg-tile {
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    background: #111b21;
    transition: border-color .2s, transform .12s;
    position: relative;
  }
  .bg-tile:hover { transform: translateY(-2px); }
  .bg-tile.active { border-color: #00a884; }
  .bg-tile.active::after {
    content: "✓";

/* ============================================================
   0. ИДЕНТИФИКАТОРЫ
   ============================================================ */
const GENERAL_ROOM_ID = 'general';

function getOrCreateUserId() {
  let id = null;
  try { id = localStorage.getItem('voicechat_user_id'); } catch(e) {}
  if (!id || !/^usr_[a-z0-9]{6,}$/i.test(id)) {
    id = 'usr_' + Math.random().toString(36).substring(2, 8) +
                Math.random().toString(36).substring(2, 6);
    try { localStorage.setItem('voicechat_user_id', id); } catch(e) {}
  }
  return id;
}
const USER_ID = getOrCreateUserId();

function isIdRemembered() {
  try { return localStorage.getItem('voicechat_id_remembered') === 'true'; } catch(e) { return false; }
}
function setRemembered(v) {
  try { localStorage.setItem('voicechat_id_remembered', v ? 'true' : 'false'); } catch(e) {}
}

function getInitialRoomId() {
  let room = null;
  try {
    const url = new URL(window.location.href);
    room = url.searchParams.get('room');
  } catch (e) {}
  if (!room) {
    try { room = localStorage.getItem('voicechat_last_room'); } catch(e) {}
  }
  return room || GENERAL_ROOM_ID;
}
let currentRoomId = getInitialRoomId();

function persistRoom(id) {
  try { localStorage.setItem('voicechat_last_room', id); } catch (e) {}
  currentRoomId = id;
  try {
    const url = new URL(window.location.href);
    if (id === GENERAL_ROOM_ID) url.searchParams.delete('room');
    else url.searchParams.set('room', id);
    history.replaceState({}, '', url.toString());
  } catch (e) {}
}
function buildInviteLink(roomId = currentRoomId) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?room=${encodeURIComponent(roomId)}`;
}
function getRoomLabel(roomId) {
  if (roomId === GENERAL_ROOM_ID) return 'Общий чат';
  if (roomId === USER_ID)          return 'Мой личный чат';
  return `Чат ${roomId.substring(0, 12)}`;
}
function updateRoomUI() {
  topTitle.childNodes[0].nodeValue = getRoomLabel(currentRoomId) + ' ';
  topSub.textContent = 'комната · ' + currentRoomId;
  const roomEl = document.getElementById('roomIdDisplay');
  if (roomEl) roomEl.textContent = currentRoomId;
  const ch = USER_ID.replace(/^usr_/, '').charAt(0).toUpperCase() || 'U';
  document.getElementById('userAvatar').textContent = ch;
  document.getElementById('userIdDisplay').textContent = USER_ID;

  // Home button active state
  const homeBtn = document.getElementById('homeBtn');
  homeBtn.classList.toggle('active', currentRoomId === GENERAL_ROOM_ID);

  // Lock remembered state
  const lockBtn = document.getElementById('lockBtn');
  const userCard = document.getElementById('userCard');
  const remembered = isIdRemembered();
  lockBtn.classList.toggle('remembered', remembered);
  userCard.classList.toggle('remembered', remembered);
}

async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
function formatTime(date = new Date()) {
  return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function formatDuration(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function generateWaveform(count = 34, seed = null) {
  const bars = [];
  for (let i = 0; i < count; i++) {
    let h;
    if (seed !== null) {
      const x = Math.sin(seed * (i + 1) * 12.9898) * 43758.5453;
      h = 5 + (Math.abs(x) % 1) * 21;
      h = h * 0.7 + (8 + Math.sin(i * 0.7 + seed * 0.001) * 6) * 0.3;
    } else h = 5 + Math.random() * 21;
    bars.push(Math.max(4, Math.min(26, h)));
  }
  return bars;
}
function showHint(text, dur = 2200) {
  const hint = document.getElementById('hint');
  hint.textContent = text;
  hint.classList.add('show');
  clearTimeout(hint._t);
  hint._t = setTimeout(() => hint.classList.remove('show'), dur);
}
function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

/* ============================================================
   4. УДАЛЕНИЕ
   ============================================================ */
let activeMenu = null;
function closeMenu() { if (activeMenu) { activeMenu.remove(); activeMenu = null; } }

function showMessageMenu(msg, x, y) {
  closeMenu();
  const menu = document.createElement('div');
  menu.className = 'msg-menu';
  menu.innerHTML = `
    <button class="msg-menu-btn danger" data-action="delete">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>Удалить сообщение</span>
    </button>`;
  document.body.appendChild(menu);
  activeMenu = menu;
  const rect = menu.getBoundingClientRect();
  const pad = 10;
  let left = x, top = y;
  if (left + rect.width + pad > window.innerWidth)  left = window.innerWidth - rect.width - pad;
  if (top + rect.height + pad > window.innerHeight) top  = window.innerHeight - rect.height - pad;
  if (left < pad) left = pad;
  if (top < pad)  top = pad;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  menu.querySelector('[data-action="delete"]').addEventListener('click', (e) => {
    e.stopPropagation();
    deleteMessage(msg);
    closeMenu();
  });
  setTimeout(() => {
    const onDocClick = (e) => {
      if (activeMenu && !activeMenu.contains(e.target)) {
        closeMenu();
        document.removeEventListener('click', onDocClick);
        document.removeEventListener('touchstart', onDocClick);
      }
    };
    document.addEventListener('click', onDocClick);
    document.addEventListener('touchstart', onDocClick);
  }, 30);
}

function deleteMessage(msg) {
  if (msg.classList.contains('deleted')) return;
  const timeEl = msg.querySelector('.time');
  let timeText = formatTime();
  if (timeEl) {
    for (const node of timeEl.childNodes) {
      if (node.nodeType === Node.TEXT_NODE && node.textContent.trim()) {
        timeText = node.textContent.trim(); break;
      }
    }
  }
  const isOut = msg.classList.contains('out');
  msg.classList.add('deleting');
  setTimeout(() => {
    msg.classList.remove('deleting');
    msg.classList.add('deleted');
    msg.classList.remove('in', 'out');
    msg.innerHTML = `
      <div class="deleted-content">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/></svg>
        <span>Это сообщение удалено</span>
      </div>
      <span class="time">${timeText}${isOut ? '<span class="ticks">✓✓</span>' : ''}</span>`;
  }, 180);
}

function attachDeleteHandlers(msg) {
  let pressTimer = null;
  let startX = 0, startY = 0, moved = false;
  function startPress(e) {
    if (msg.classList.contains('deleted')) return;
    moved = false;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      if (!moved) {
        showMessageMenu(msg, startX, startY);
        if (navigator.vibrate) navigator.vibrate(15);
      }
    }, 500);
  }
  function cancelPress() { clearTimeout(pressTimer); }
  function onMove(e) {
    const pt = e.touches ? e.touches[0] : e;
    if (Math.abs(pt.clientX - startX) > 8 || Math.abs(pt.clientY - startY) > 8) {
      moved = true; cancelPress();
    }
  }
  function onContext(e) {
    if (msg.classList.contains('deleted')) return;
    e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;
    showMessageMenu(msg, pt.clientX, pt.clientY);
  }
  msg.addEventListener('mousedown', startPress);
  msg.addEventListener('mouseup', cancelPress);
  msg.addEventListener('mouseleave', cancelPress);
  msg.addEventListener('mousemove', onMove);
  msg.addEventListener('touchstart', startPress, { passive: true });
  msg.addEventListener('touchend', cancelPress);
  msg.addEventListener('touchcancel', cancelPress);
  msg.addEventListener('touchmove', onMove, { passive: true });
  msg.addEventListener('contextmenu', onContext);
}

/* ============================================================
   5. ГОЛОСОВОЕ СООБЩЕНИЕ
   ============================================================ */
function createVoiceMessage({ src, duration, direction, waveform, timestamp }) {
  const msg = document.createElement('div');
  msg.className = `msg ${direction}`;
  const bubble = document.createElement('div');
  bubble.className = 'voice-bubble';
  const playBtn = document.createElement('button');
  playBtn.className = 'play-btn';
  playBtn.innerHTML = `
    <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z"/></svg>
    <svg viewBox="0 0 24 24" class="icon-pause" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;
  const wave = document.createElement('div');
  wave.className = 'waveform';
  const bars = waveform || generateWaveform(34, Date.now());
  const barEls = [];
  bars.forEach(h => {
    const b = document.createElement('div');
    b.className = 'wave-bar';
    b.style.height = h + 'px';
    wave.appendChild(b);
    barEls.push(b);
  });
  const info = document.createElement('div');
  info.className = 'voice-info';
  info.innerHTML = `
    <svg class="mic-icon-mini" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
    <span class="voice-duration">${formatDuration(duration)}</span>`;
  bubble.appendChild(playBtn); bubble.appendChild(wave); bubble.appendChild(info);
  const time = document.createElement('span');
  time.className = 'time';
  time.innerHTML = formatTime(timestamp || new Date()) +
    (direction === 'out' ? '<span class="ticks">✓✓</span>' : '');
  msg.appendChild(bubble); msg.appendChild(time);
  messagesEl.appendChild(msg);
  scrollDown();
  attachDeleteHandlers(msg);

  let audio = null, playing = false, animationFrame = null;
  function setPlayedBars(p) {
    const idx = Math.floor(p * barEls.length);
    barEls.forEach((b, i) => b.classList.toggle('played', i < idx));
  }
  function resetBars() { barEls.forEach(b => b.classList.remove('played')); }
  function updateProgress() {
    if (!audio) return;
    const p = audio.currentTime / audio.duration || 0;
    setPlayedBars(p);
    info.querySelector('.voice-duration').textContent =
      formatDuration(Math.max(0, (audio.duration || duration) - audio.currentTime));
    if (!audio.paused && !audio.ended) animationFrame = requestAnimationFrame(updateProgress);
  }
  function stopPlaying() {
    if (audio) { audio.pause(); audio.currentTime = 0; }
    playing = false;
    cancelAnimationFrame(animationFrame);
    resetBars();
    info.querySelector('.voice-duration').textContent = formatDuration(duration);
    playBtn.querySelector('.icon-play').style.display = '';
    playBtn.querySelector('.icon-pause').style.display = 'none';
  }
  function togglePlay() {
    if (!src) {
      if (playing) { stopPlaying(); return; }
      playing = true;
      playBtn.querySelector('.icon-play').style.display = 'none';
      playBtn.querySelector('.icon-pause').style.display = '';
      const start = performance.now();
      const tick = () => {
        const elapsed = (performance.now() - start) / 1000;
        const p = elapsed / duration;
        if (p >= 1 || !playing) { stopPlaying(); return; }
        setPlayedBars(p);
        info.querySelector('.voice-duration').textContent = formatDuration(duration - elapsed);
        animationFrame = requestAnimationFrame(tick);
      };
      tick();
      return;
    }
    if (!audio) {
      audio = new Audio(src);
      audio.addEventListener('ended', stopPlaying);
    }
    if (audio.paused) {
      document.querySelectorAll('audio').forEach(a => { if (a !== audio) a.pause(); });
      audio.play();
      playing = true;
      playBtn.querySelector('.icon-play').style.display = 'none';
      playBtn.querySelector('.icon-pause').style.display = '';
      animationFrame = requestAnimationFrame(updateProgress);
    } else {
      audio.pause();
      playing = false;
      cancelAnimationFrame(animationFrame);
      playBtn.querySelector('.icon-play').style.display = '';
      playBtn.querySelector('.icon-pause').style.display = 'none';
    }
  }
  playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  wave.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio && audio.duration) {
      const rect = wave.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      updateProgress();
    } else togglePlay();
  });
  return msg;
}

/* ============================================================
   6. ЗАПИСЬ + ФИКСАЦИЯ ЧЕРЕЗ 5 СЕК
   ============================================================ */
const recordBtn = document.getElementById('recordBtn');
const LOCK_AFTER_MS = 5000;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordStartTime = 0;
let recordTimer = null;
let analyser = null;
let audioCtx = null;
let persistentStream = null;
let liveWaveRAF = null;
let cancelled = false;
let lockTimer = null;
let locked = false;

async function initMicrophone() {
  if (persistentStream && persistentStream.active) return persistentStream;
  try {
    persistentStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    return persistentStream;
  } catch (err) {
    console.warn('Микрофон не инициализирован:', err);
    return null;
  }
}
initMicrophone().then(s => { if (!s) showHint('Разреши доступ к микрофону 🎤', 2600); });

async function startRecording() {
  if (isRecording) return;
  cancelled = false;

  if (!persistentStream || !persistentStream.active) await initMicrophone();
  if (!persistentStream) { showHint('Микрофон недоступен'); return; }

  isRecording = true;
  audioChunks = [];
  recordStartTime = Date.now();
  locked = false;

  let mimeType = '';
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for (const c of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) { mimeType = c; break; }
  }
  try {
    mediaRecorder = mimeType
      ? new MediaRecorder(persistentStream, { mimeType })
      : new MediaRecorder(persistentStream);
  } catch (err) {
    console.error(err);
    showHint('Запись не поддерживается браузером');
    isRecording = false;
    return;
  }
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.start(100);

  recordBtn.classList.add('recording');
  recordBtn.classList.remove('locked');
  recordBtn.innerHTML = `
    <span class="rec-timer" id="recTimer">0:00</span>
    <div class="live-wave" id="liveWave"></div>`;
  const liveWave = document.getElementById('liveWave');
  const LIVE_BARS = 22;
  const liveBars = [];
  for (let i = 0; i < LIVE_BARS; i++) {
    const b = document.createElement('div');
    b.className = 'live-bar';
    b.style.height = '5px';
    liveWave.appendChild(b);
    liveBars.push(b);
  }

  const recTimer = document.getElementById('recTimer');
  recordTimer = setInterval(() => {
    const elapsed = (Date.now() - recordStartTime) / 1000;
    recTimer.textContent = formatDuration(elapsed);
  }, 100);

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(persistentStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    (function drawLive() {
      if (!isRecording) return;
      analyser.getByteFrequencyData(dataArray);
      const step = Math.floor(dataArray.length / LIVE_BARS);
      for (let i = 0; i < LIVE_BARS; i++) {
        let sum = 0;
        for (let j = 0; j < step; j++) sum += dataArray[i * step + j];
        const avg = sum / step;
        const h = 5 + (avg / 255) * 18;
        liveBars[i].style.height = h + 'px';
      }
      liveWaveRAF = requestAnimationFrame(drawLive);
    })();
  } catch (err) { console.warn('Визуализация недоступна', err); }

  clearTimeout(lockTimer);
  lockTimer = setTimeout(() => {
    if (!isRecording) return;
    locked = true;
    recordBtn.classList.add('locked');
    const recTimerEl = document.getElementById('recTimer');
    if (recTimerEl && !recordBtn.querySelector('.lock-indicator')) {
      const lockIcon = document.createElement('span');
      lockIcon.className = 'lock-indicator';
      lockIcon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>';
      recordBtn.insertBefore(lockIcon, recTimerEl);
    }
    showHint('🔒 Запись зафиксирована. Нажми чтобы отправить', 3500);
    if (navigator.vibrate) navigator.vibrate([25, 40, 25]);
  }, LOCK_AFTER_MS);

  showHint('Идёт запись… Удержи 5 сек для фиксации', 1800);
}

function stopRecording(send = true) {
  if (!isRecording) return;
  isRecording = false;
  locked = false;

  clearInterval(recordTimer);
  clearTimeout(lockTimer);
  cancelAnimationFrame(liveWaveRAF);
  lockTimer = null;

  const duration = (Date.now() - recordStartTime) / 1000;
  const mimeUsed = mediaRecorder.mimeType || 'audio/webm';

  const finish = () => {
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    analyser = null;

    recordBtn.classList.remove('recording');
    recordBtn.classList.remove('locked');
    recordBtn.innerHTML = `
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      <span>Нажми и запиши</span>`;

    if (send && !cancelled && duration >= 0.4 && audioChunks.length > 0) {
      const blob = new Blob(audioChunks, { type: mimeUsed });
      const src = URL.createObjectURL(blob);
      const waveform = generateWaveform(34, Date.now());
      createVoiceMessage({ src, duration, direction: 'out', waveform });
      simulateReply();
    } else if (cancelled) showHint('Запись отменена');
    else if (duration < 0.4) showHint('Слишком короткое сообщение');
  };

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.onstop = finish;
    try { mediaRecorder.stop(); } catch(e) { finish(); }
  } else finish();
}

/* ============================================================
   7. ИМИТАЦИЯ ОТВЕТА
   ============================================================ */
function simulateReply() {
  setTimeout(() => {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typing);
    scrollDown();
    setTimeout(() => {
      typing.remove();
      const durations = [2.4, 4.1, 1.8, 3.5, 5.2, 2.1, 3.7];
      const d = durations[Math.floor(Math.random() * durations.length)];
      createVoiceMessage({
        src: null, duration: d, direction: 'in',
        waveform: generateWaveform(34, Date.now() + Math.random() * 1000)
      });
    }, 1600 + Math.random() * 1200);
  }, 500 + Math.random() * 700);
}

/* ============================================================
   8. КНОПКА ЗАПИСИ
   ============================================================ */
let pressTimer = null;

function onPressStart(e) {
  if (e.target.closest('.hamburger') || e.target.closest('.drawer') || e.target.closest('.topbar-close')
      || e.target.closest('.home-btn') || e.target.closest('.lock-btn')) return;
  e.preventDefault();
  if (isRecording && locked) { stopRecording(true); return; }
  if (isRecording) return;
  pressTimer = setTimeout(startRecording, 180);
}
function onPressEnd(e) {
  e.preventDefault();
  clearTimeout(pressTimer);
  if (isRecording && !locked) stopRecording(true);
}
function onPressCancel(e) {
  clearTimeout(pressTimer);
  if (isRecording && !locked) { cancelled = true; stopRecording(false); }
}

recordBtn.addEventListener('mousedown', onPressStart);
recordBtn.addEventListener('touchstart', onPressStart, { passive: false });
recordBtn.addEventListener('mouseup', onPressEnd);
recordBtn.addEventListener('touchend', onPressEnd);
recordBtn.addEventListener('mouseleave', onPressCancel);
recordBtn.addEventListener('touchcancel', onPressCancel);

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !isRecording && e.target === document.body) {
    e.preventDefault(); startRecording();
  }
  if (e.key === 'Escape') closeMenu();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && isRecording && !locked) {
    e.preventDefault(); stopRecording(true);
  }
});

/* ============================================================
   9. СТАРТ
   ============================================================ */
updateRoomUI();

(function welcomeToRoom() {
  if (currentRoomId === GENERAL_ROOM_ID) {
    setTimeout(() => {
      createVoiceMessage({ src:null, duration:3.2, direction:'in',  waveform:generateWaveform(34,101) });
      setTimeout(() => createVoiceMessage({ src:null, duration:1.7, direction:'out', waveform:generateWaveform(34,202) }), 350);
      setTimeout(() => createVoiceMessage({ src:null, duration:5.4, direction:'in',  waveform:generateWaveform(34,303) }), 700);
    }, 250);
  } else {
    setTimeout(() => {
      const notice = document.createElement('div');
      notice.className = 'join-notice';
      notice.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <span>Вы вошли в комнату ${currentRoomId}</span>`;
      messagesEl.appendChild(notice);
      createVoiceMessage({ src:null, duration:2.5, direction:'in', waveform:generateWaveform(34, 777) });
    }, 300);
  }
})();

setTimeout(() => showHint('Зажми кнопку и говори 🎤'), 1200);
setTimeout(() => showHint('🏠 — общий чат · 🔒 — запомнить ID'), 4500);
</script>
